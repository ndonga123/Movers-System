<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | IoT Movers System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="login-container">
    <h2>IoT Movers System</h2>
    <p>Login to Dashboard</p>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email address" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="errorMsg" class="error"></p>
  </div>

  <script>
    const API_BASE = "http://localhost:5000/api";
    // After hosting:
    // const API_BASE = "https://your-render-url.onrender.com/api";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById("errorMsg").innerText = data.message || "Login failed";
          return;
        }

        // Save token (for future use)
        localStorage.setItem("token", data.token);

        // Redirect to dashboard
        window.location.href = "dashboard.html";

      } catch (err) {
        document.getElementById("errorMsg").innerText = "Server error";
      }
    });
  </script>

</body>
</html>
