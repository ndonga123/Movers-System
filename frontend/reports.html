<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reports</title>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>
<div class="layout">

<aside class="sidebar">
  <h2>IoT Movers</h2>
  <a href="dashboard.html">Dashboard</a>
  <a href="vehicles.html">Vehicles</a>
  <a href="drivers.html">Drivers</a>
  <a href="sensors.html">Sensors</a>
  <a class="active">Reports</a>
</aside>

<main>
<h1>Incident Reports</h1>

<div class="card big">
  <table class="data-table">
    <thead>
      <tr>
        <th>Vehicle</th>
        <th>Issue</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="reportList"></tbody>
  </table>
</div>

<div class="card big">
  <h3>Create Report</h3>
  <form id="reportForm">
    <input id="rvehicle" placeholder="Vehicle ID" required>
    <input id="rissue" placeholder="Issue Description" required>
    <select id="rstatus">
      <option>Open</option>
      <option>Resolved</option>
    </select>
    <button>Submit</button>
  </form>
</div>

</main>
</div>

<script src="js/reports.js"></script>
</body>
</html>
