<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vehicles</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <h2>IoT Movers System</h2>
    <a href="dashboard.html">Dashboard</a>
    <a class="active">Vehicles</a>
    <a href="reports.html">Reports</a>
    <button onclick="toggleDark()">🌙</button>
    <a href="login.html">Logout</a>
  </aside>

  <main>
    <h1>Vehicles</h1>
    <p>Live fleet status</p>

    <div class="card big">
      <ul id="vehicleList" class="vehicle-list"></ul>
    </div>
    <div class="card big">
  <h3>Add Vehicle</h3>

  <form id="addVehicleForm" class="vehicle-form">
    <input type="text" id="name" placeholder="Vehicle Name" required />
    <input type="text" id="lat" placeholder="Start Latitude" required />
    <input type="text" id="lng" placeholder="Start Longitude" required />
    <input id="from" placeholder="From (e.g Nairobi)">
    <input id="to" placeholder="To (e.g Nakuru)">
    <button type="submit">Add Vehicle</button>
  </form>
</div>

  </main>

</div>

<script src="js/vehicles.js"></script>
<script>
const API = "https://movers-system.onrender.com/api/vehicles";

document.getElementById("vehicleForm").addEventListener("submit", async e => {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    lat: document.getElementById("lat").value,
    lng: document.getElementById("lng").value
  };

  await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  alert("Vehicle added!");
  e.target.reset();
  loadVehicles();
});

async function loadVehicles() {
  const res = await fetch(API);
  const vehicles = await res.json();

  const list = document.getElementById("vehicleList");
  if (!list) return;

  list.innerHTML = "";

  vehicles.forEach(v => {
    const li = document.createElement("li");
    li.textContent = `${v.name} (${v.lat}, ${v.lng})`;
    list.appendChild(li);
  });
}

loadVehicles();
</script>

<footer class="footer">
  © 2026 IoT Movers System | Real-time Fleet Tracking
</footer>

</body>
</html>
