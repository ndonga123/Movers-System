<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Movers Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">
<script src="dashboard.js"></script>
  <script>
    // simple auth check (optional)
    if (!localStorage.getItem("auth")) {
      console.warn("Not logged in");
    }
  </script>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>🚚 IoT Movers</h2>
    <nav>
      <a class="active">Dashboard</a>
      <a>Vehicles</a>
      <a>Alerts</a>
      <a>Reports</a>
    </nav>
    <button class="toggle" onclick="document.body.classList.toggle('dark')">
      🌙 Dark Mode
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOP CARDS -->
    <section class="top-cards">
      <div class="card">
        <h4>GPS</h4>
        <p>Nairobi, KE</p>
      </div>
      <div class="card">
        <h4>Active Vehicles</h4>
        <p>3</p>
      </div>
      <div class="card">
        <h4>Temperature</h4>
        <p>24°C | 60%</p>
      </div>
    </section>

    <!-- MAP + SENSOR -->
    <section class="content">
      <div class="card large">
        <h3>Vehicle Tracking</h3>
        <div class="map-placeholder">
          🗺️ Map will appear here
        </div>
      </div>

      <div class="card">
        <h3>Sensor Data</h3>
        <p>Temperature: <strong>24°C</strong></p>
        <p>Humidity: <strong>60%</strong></p>
        <p>Status: <span class="ok">Normal</span></p>
      </div>
    </section>

    <!-- TABLE -->
    <section class="card table-card">
      <h3>Delivery Log</h3>
      <table>
        <thead>
          <tr>
            <th>Vehicle</th>
            <th>Driver</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Truck 01</td>
            <td>James</td>
            <td class="ok">On Route</td>
          </tr>
          <tr>
            <td>Van 02</td>
            <td>Amina</td>
            <td class="warn">Delayed</td>
          </tr>
        </tbody>
      </table>
    </section>

  </main>
</div>

</body>
</html>
