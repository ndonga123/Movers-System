<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>IoT Movers Dashboard</title>

<link rel="stylesheet" href="css/styles.css">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Routing -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
<script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="layout">

  <aside class="sidebar">
    <h2>IoT Movers System</h2>
    <a class="active">Dashboard</a>
    <a>Vehicles</a>
    <a>Reports</a>
    <button onclick="toggleDark()">🌙</button>
    <a href="login.html">Logout</a>
  </aside>

  <main>
    <h1>Welcome to the Dashboard</h1>
    <p class="sub">Real-time fleet monitoring</p>

    <div class="cards">
      <div class="card">📍 GPS <span id="gps">--</span></div>
      <div class="card">🌡 Temp <span id="temp">--</span></div>
      <div class="card">💧 Humidity <span id="hum">--</span></div>
    </div>

    <div class="grid">

  <!-- VEHICLE LIST -->
  <div class="card big">
    <h3>Active Vehicles</h3>
    <ul id="vehicleList" class="vehicle-list"></ul>
  </div>

  <!-- CHART -->
  <div class="card big">
    <h3>Temperature & Humidity</h3>
    <canvas id="sensorChart" height="120"></canvas>
  </div>

  <!-- MAP -->
  <div class="card big">
    <h3>GPS Route</h3>
    <div id="map" style="height:300px;border-radius:12px;"></div>
  </div>

</div>
    </main>
  </div>

  <!-- Your dashboard logic -->
  <script src="js/dashboard.js"></script>

</body>
</html>
